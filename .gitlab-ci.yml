variables:
  MAVEN_OPTS: "-Dhttps.protocols=TLSv1.2 -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true"
  MAVEN_CLI_OPTS: "--batch-mode -ntp --errors --fail-at-end --show-version -DinstallAtEnd=true -DdeployAtEnd=true"
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
  GIT_STRATEGY: clone
  APP_PORTS: "8040 7040"
  GITURL_CICD: "https://user:$release_token@git.gns.cri.nz/applications/cicdutils.git"

image: maven:3-openjdk-11

stages:
  - build
  - deploy
  - image
  - deploy-prod

default:
  before_script:
    - cp $settings_xml ~/.m2/settings.xml

build:
  tags:
    - docker
  stage: build
  except:
    - master
  script: |
    mvn $MAVEN_CLI_OPTS clean deploy

release:
  tags:
    - docker
  stage: deploy
  only:
    - master
  script: |
    git config user.name "\"$GITLAB_USER_NAME\""
    git config user.email "\"$GITLAB_USER_EMAIL\""
    git config http.sslverify false
    git remote set-url --push origin "https://gitlab-project-token:$release_token@git.gns.cri.nz/$CI_PROJECT_PATH.git"
    git config pull.ff only
    mvn $MAVEN_CLI_OPTS -Pprod gitflow:release-start
    mvn $MAVEN_CLI_OPTS -Pprod gitflow:release-finish

deploy-dev:
  tags:
    - linux
  stage: deploy
  when: manual
  before_script:
      - git clone $GITURL_CICD
  after_script:
      - rm -rf cicdutils
      - git clean -fdX    
  script: |
    export NAME="$( ./cicdutils/pom_artifact.sh )"
    export VERSION="$( ./cicdutils/pom_version.sh )"
    IMAGE="${NAME}:${VERSION}"
    APP_NAME="$( ./cicdutils/pom_app_name.sh)"
    APP_SERVER="Applications Development"
    TEAM="Applications"
    DOCKER_CONFIG=(HostConfig:='{ "PortBindings": { "8080/tcp": [{ "HostPort": "9010" }] }, "NetworkMode": "reverseproxy-nw", "RestartPolicy": {"Name":"always" } }' )
    cp src/main/resources/application-dev.properties src/main/resources/application.properties
    mvn clean dependency:copy -P docker
    ./cicdutils/docker_build_deploy.sh -i "$IMAGE" -a "$APP_NAME" -s "$APP_SERVER" -t "$TEAM" -d "$DOCKER_CONFIG"

deploy-staging:
  tags:
    - linux
  stage: deploy
  when: manual
  before_script:
      - git clone $GITURL_CICD
  after_script:
      - rm -rf cicdutils
      - git clean -fdX      
  script: |
    export NAME="$( ./cicdutils/pom_artifact.sh )"
    export VERSION="$( ./cicdutils/pom_version.sh )"
    IMAGE="${NAME}:${VERSION}"
    APP_NAME="$( ./cicdutils/pom_app_name.sh)"
    APP_SERVER="GNS Web Application Staging"
    TEAM="Applications"
    cp src/main/resources/application-dev.properties src/main/resources/application.properties
    mvn clean dependency:copy -P docker
    DOCKER_CONFIG=(HostConfig:='{ "PortBindings": { "8080/tcp": [{ "HostPort": "8040" }] }, "NetworkMode": "reverseproxy-nw", "RestartPolicy": {"Name":"always" } }' )
    ./cicdutils/docker_build_deploy.sh -i "$IMAGE" -a "$APP_NAME" -s "$APP_SERVER" -t "$TEAM" -d "$DOCKER_CONFIG"

deploy-live:
  tags:
    - linux
  stage: deploy-prod
  when: manual
  before_script:
      - git clone $GITURL_CICD
  after_script:
      - rm -rf cicdutils
      - git clean -fdX     
  script: |
    export APP_SERVER="GNS Web Applications Internal"
    export APP_HOST="webapp-internal.gns.cri.nz"
    export NAME="$( ./cicdutils/pom_artifact.sh )"
    mkdir target
    export VERSION=$( ./cicdutils/get_version.sh newsite/new-site-api -o target/siteapp.jar --version latest )
    IMAGE="$( ./cicdutils/pom_image_name.sh )"
    export APP_NAME="$( ./cicdutils/pom_app_name.sh)"
    export TEAM="Applications"
    ./cicdutils/docker_build.sh -i "$IMAGE"   
    ./cicdutils/available_tomcat_port.sh $APP_HOST $APP_PORTS
    port=$(./cicdutils/available_tomcat_port.sh $APP_HOST $APP_PORTS)
    container="$APP_NAME-$port"  
    export DOCKER_CONFIG=(HostConfig:="{ \"PortBindings\": { \"8080/tcp\": [ { \"HostPort\": \"${port}\" } ] }, \"NetworkMode\": \"reverseproxy-nw\", \"RestartPolicy\": {\"Name\":\"always\" } }" )  
    ./cicdutils/docker_deploy.sh -i "$IMAGE" -a "$container" -s "$APP_SERVER" -t "$TEAM" -d "$DOCKER_CONFIG"   
    ./cicdutils/wait_for_tomcat.sh $APP_HOST $port site/api/v1/islands
    ./cicdutils/notify_teams.sh $teams_webhook "Site API ${VERSION} deployed to production"
    ./cicdutils/remove_old_tomcat.sh $port $APP_PORTS