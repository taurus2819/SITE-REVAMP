stages:
  - build
  - deploy
  - image

build:
  image: openjdk:11
  tags:
    - docker
  stage: build
  script:
    - ./mvnw clean verify -ntp -s .mvn/settings.xml
  # artifacts:
  #   reports:
  #     junit:
  #       - target/surefire-reports/TEST-*.xml
  #     cobertura:
  #       - target/site/jacoco/jacoco.xml


release:
  image: openjdk:11
  tags:
    - docker
  stage: deploy
  only:
    - main
  script: |
    ./mvnw jgitflow:release-start -ntp -B -s .mvn/settings.xml
    ./mvnw jgitflow:release-finish -ntp -s .mvn/settings.xml


deploy:
  tags:
    - linux
  stage: deploy
  script: |
    . ./docker_build.sh -s App-dev -t GGW


